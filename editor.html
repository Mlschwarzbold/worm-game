<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worm Level Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Worm Level Editor</h1>
      <p>Edit level graphs: drag nodes, change types, and modify edges.</p>
      <p><a href="index.html">Back to Game</a></p>
    </header>

    <section class="layout">
      <aside class="panel">
        <label class="field">
          <span>Level</span>
          <select id="level-select"></select>
        </label>
        <div class="row">
          <input id="new-level-name" type="text" placeholder="New level name">
          <button id="create-level" type="button">Create Level</button>
        </div>

        <div class="section">
          <h2>Selected Node</h2>
          <p id="selected-node">None</p>
          <label class="field">
            <span>Node Type</span>
            <select id="node-type" disabled>
              <option value="normal">normal</option>
              <option value="start">start</option>
              <option value="end">end</option>
              <option value="food">food</option>
            </select>
          </label>
          <div class="row">
            <button id="add-node" type="button">Add Node</button>
            <button id="delete-node" type="button" disabled>Delete Node</button>
          </div>
        </div>

        <div class="section">
          <h2>Edges</h2>
          <label class="field">
            <span>From</span>
            <select id="edge-from"></select>
          </label>
          <label class="field">
            <span>To</span>
            <select id="edge-to"></select>
          </label>
          <button id="add-edge" type="button">Add Edge</button>
          <label class="field">
            <span>Existing Edges</span>
            <select id="edge-list" size="8"></select>
          </label>
          <button id="delete-edge" type="button" disabled>Delete Selected Edge</button>
        </div>

        <div class="section">
          <h2>Export</h2>
          <button id="export-level" type="button">Generate JS</button>
          <textarea id="export-output" rows="8" readonly></textarea>
        </div>
      </aside>

      <section class="board-wrap">
        <svg id="editor-graph" class="board" viewBox="0 0 800 600" role="img" aria-label="Level editor graph"></svg>
      </section>
    </section>
  </main>

  <div id="context-menu" class="context-menu hidden"></div>

  <footer class="footer">Worm Game <span id="app-version"></span></footer>
  <script src="version.js"></script>
  <script src="levels/manifest.js"></script>
  <script src="editor.js"></script>
</body>
</html>
