<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worm Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Worm Game</h1>
      <p>Eat all of the <span style="color: yellow;">food</span>, then get to the <span style="color: red;">finish</span>.</p>
      <p><a href="editor.html">Open Level Editor</a></p>
    </header>

    <section class="level-controls" aria-label="Level controls">
      <button id="prev-level" type="button">Previous Level</button>
      <div class="level-info">
        <strong id="level-name">Level</strong>
        <span id="level-meta"></span>
      </div>
      <button id="next-level" type="button">Next Level</button>
    </section>

    <section class="board-wrap">
      <svg id="graph" class="board" viewBox="0 0 800 600" role="img" aria-label="Puzzle graph"></svg>
    </section>
    <canvas id="confetti-canvas"></canvas>

    <section class="bottom-controls" aria-label="Game controls">
      <button id="retry-level" type="button">Retry Level</button>
      <button id="win-next-level" type="button" hidden>Go to Next Level</button>
      <span id="win-message" hidden>Level complete!</span>
    </section>
  </main>

  <footer class="footer">Worm Game <span id="app-version"></span></footer>
  <script src="version.js"></script>
  <script src="levels/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
